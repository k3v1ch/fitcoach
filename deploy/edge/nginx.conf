# nginx edge ИС «ФитКоуч». Сайт — templates/fitcoach.conf.template (подставляется ${DOMAIN}).
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    # Б9: бэкенд принимает файлы до 10 МБ и сам отвечает 413 в формате API; nginx режет только явный перебор.
    client_max_body_size 12m;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Б5: ограничение частоты запросов по IP. Исключения (нагрузочный тест) — /etc/nginx/shared/ratelimit-allow.conf.
    geo $rl_exempt {
        default 0;
        include /etc/nginx/shared/ratelimit-allow.conf;
    }
    map $rl_exempt $rl_key {
        0 $binary_remote_addr;
        1 "";
    }
    limit_req_zone $rl_key zone=api:10m rate=20r/s;
    limit_req_zone $rl_key zone=auth:10m rate=10r/m;
    limit_conn_zone $rl_key zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # DNS Docker: имя backend переразрешается после пересоздания контейнера.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
