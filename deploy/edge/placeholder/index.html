  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;

  h1 { margin: 0 0 8px; font-size: 28px; }
  .badge { display: inline-block; margin-bottom: 16px; padding: 2px 12px; border-radius: 999px;
           background: var(--accent); color: var(--dark); font-weight: 600; }

  a { color: var(--dark); font-weight: 600; }
</style>

<main>
  <span class="badge">Сервер работает</span>
