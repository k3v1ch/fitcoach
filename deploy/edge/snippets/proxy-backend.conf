# Проксирование в Spring Boot. Через переменную имя backend резолвится при запросе (resolver в nginx.conf).
set $fitcoach_backend http://backend:8080;
proxy_pass $fitcoach_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# edge — первая точка входа: заголовок клиента перезаписываем, подделать IP нельзя.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
