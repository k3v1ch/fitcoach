# ФитКоуч: усиление SSH. Читается раньше 50-cloud-init.conf, поэтому значения отсюда главнее.
PermitRootLogin prohibit-password
X11Forwarding no
LoginGraceTime 30
AllowUsers root git
ClientAliveInterval 300
ClientAliveCountMax 2

# git — только git push/pull: никаких туннелей и проброса портов.
# Пароль разрешён только git (решение команды: push по паролю); root и остальные — только ключ.
Match User git
    PasswordAuthentication yes
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    X11Forwarding no
    PermitTTY no
